<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulador Político Deluxe 3.0</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>

  <!-- Fade -->
  <div id="cineFade" class="fade hidden"></div>

  <!-- TELA INTRO -->
  <section id="screenIntro" class="screen screen--intro show">
    <div class="intro-content glass">
      <h1 class="title">SIMULADOR POLÍTICO<br><span>DELUXE 3.0</span></h1>
      <p class="subtitle">Construa sua carreira — do bairro ao palácio.</p>
      <button id="btnStart" class="btn btn-gold btn-xl">INICIAR</button>
    </div>
  </section>

  <!-- TELA SETUP -->
  <section id="screenSetup" class="screen">
    <div class="setup glass">
      <h2>Crie seu Perfil Político</h2>

      <label>Partido:</label>
      <select id="selParty"></select>

      <label>Estado:</label>
      <select id="selState"></select>

      <label>Cidade:</label>
      <input id="inpCity" placeholder="Digite sua cidade">

      <button id="btnBegin" class="btn btn-gold btn-lg">Iniciar Mandato</button>
    </div>
  </section>

  <!-- TELA DO JOGO -->
  <section id="screenGame" class="screen screen-bg">

    <!-- HUD -->
    <header class="hud glass">
      <div class="hud-left">
        <img id="partyLogo" class="party-logo" src="">
        <div>
          <div id="hudOffice" class="hud-office"></div>
          <div id="hudLocation" class="hud-location"></div>
        </div>
      </div>

      <div class="hud-center">
        <div class="progress3d">
          <div id="barProgress" class="progress3d-bar"><span id="txtProgress">0%</span></div>
        </div>
        <div class="pop-row">
          <div class="pop-chip">Povo: <span id="popPeople">50%</span></div>
          <div class="pop-chip">Mídia: <span id="popMedia">50%</span></div>
          <div class="pop-chip">Partido: <span id="popParty">50%</span></div>
        </div>
      </div>

      <div class="hud-right">
        <button id="btnSave" class="btn btn-icon btn-gold">💾</button>
        <button id="btnHome" class="btn btn-icon">🏠</button>
      </div>
    </header>

    <!-- LAYOUT -->
    <main class="layout">

      <!-- AÇÕES -->
      <aside class="col-actions glass">
        <h3>Ações</h3>
        <button id="btnAction1" class="action-btn">Votar Projetos</button>
        <button id="btnAction2" class="action-btn">Propor Lei</button>
        <button id="btnAction3" class="action-btn">Gerir Crises</button>
        <button id="btnAction4" class="action-btn">Campanha</button>
      </aside>

      <!-- PAINEL CENTRAL -->
      <section class="col-main glass">
        <div id="officeImage" class="office-image"></div>

        <h3 id="mainTitle">Situação Atual</h3>
        <div id="mainText" class="main-text"></div>
      </section>

      <!-- FEED -->
      <aside class="col-feed glass">
        <h3>Noticiário</h3>
        <div id="feed"></div>
      </aside>

    </main>
  </section>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-box glass">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script src="./game.js?v=3"></script>
</body>
</html>
